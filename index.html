body{background:var(--paper)}

<div id="siteRoot" class="loading">Loading AtollSIM...</div>
<script>
var defaults={colors:{paper:'#fbfaf7',blue:'#6574f7',navy:'#090921',plum:'#650735',coral:'#ff755f'},typography:{font:'Inter'},nav:{brand:'AtollSIM',links:'Plans, Explore, Pricing, Support',login:'Log in',cta:'Try for free'},hero:{title:'Rediscover the joy\nof the journey',subtitle:'One Maldives eSIM to plan your next island adventure.',search:'Find tourist data plans in Maldives',pin:'Maldives',phoneBrand:'atoll',phoneTitle:'My eSIMs',noteTitle:'Create New Trip',note:'Unlock and activate your next adventure.',trip:'Maldives Resort Trip',tripMeta:'10 GB · 15 days',leftImage:'https://images.unsplash.com/photo-1540202404-a2f29016b523?auto=format&fit=crop&w=700&q=80',rightImage:'https://images.unsplash.com/photo-1514282401047-d79a71a590e8?auto=format&fit=crop&w=700&q=80',phoneImage:'https://images.unsplash.com/photo-1578922746465-3a80a228f223?auto=format&fit=crop&w=700&q=80',bgDesktop:'https://images.unsplash.com/photo-1514282401047-d79a71a590e8?auto=format&fit=crop&w=1800&q=80',bgMobile:'https://images.unsplash.com/photo-1578922746465-3a80a228f223?auto=format&fit=crop&w=900&q=80'},intro:{title:'The only travel eSIM you’ll need',body:'Explore simple data plans, activate before you land, and keep every transfer, booking, and WhatsApp message within reach.',button:'Start planning now →'},feature:{title:'Travel-friendly recommendations',body:'Skip airport SIM queues. Choose a plan that fits your stay and get simple setup support for your Maldives trip.',labelTitle:'Resort Ready',labelText:'10 GB for 15 days · popular',mapImage:'https://images.unsplash.com/photo-1569336415962-a4bd9f69c07b?auto=format&fit=crop&w=600&q=80'},plansTitle:'Simple Maldives plans',plans:[{tag:'Arrival',name:'Starter',description:'Maps, pickup messages, and hotel check-in.',price:'$9',meta:'/ 3 GB'},{tag:'Popular',name:'Resort Ready',description:'Daily browsing, WhatsApp, bookings, and transfers.',price:'$19',meta:'/ 10 GB'},{tag:'Extended',name:'Island Hopper',description:'Longer stays and heavier travel data use.',price:'$32',meta:'/ 25 GB'}],footer:{left:'AtollSIM',right:'Maldives travel eSIM'}};
var data=clone(defaults);
function clone(o){return JSON.parse(JSON.stringify(o))}
function mergeDefaults(base,saved){Object.keys(base).forEach(function(k){if(saved[k]===undefined)saved[k]=clone(base[k]);else if(base[k]&&typeof base[k]==='object'&&!Array.isArray(base[k]))mergeDefaults(base[k],saved[k])});return saved}
function e(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}
function renderSite(){var links=data.nav.links.split(',').map(function(x){return x.trim()}).filter(Boolean).map(function(x){return '<a>'+e(x)+'</a>'}).join('');var title=e(data.hero.title).replace('journey','<span class="plane"></span> journey');var plans=data.plans.map(function(p){return '<article class="plancard"><small>'+e(p.tag)+'</small><h3>'+e(p.name)+'</h3><p>'+e(p.description)+'</p><div class="price">'+e(p.price)+' <span>'+e(p.meta)+'</span></div></article>'}).join('');var fontMap={Inter:'Inter, ui-sans-serif, system-ui, sans-serif',Poppins:'Poppins, Inter, ui-sans-serif, system-ui, sans-serif',Montserrat:'Montserrat, Inter, ui-sans-serif, system-ui, sans-serif',Nunito:'Nunito, Inter, ui-sans-serif, system-ui, sans-serif',Lora:'Lora, Georgia, serif',Georgia:'Georgia, serif',System:'ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'};var font=fontMap[data.typography.font]||fontMap.Inter;document.getElementById('siteRoot').className='';document.getElementById('siteRoot').innerHTML='<div class="site" style="--paper:'+e(data.colors.paper)+';--hero-desktop:url('+e(data.hero.bgDesktop)+');--hero-mobile:url('+e(data.hero.bgMobile)+');--blue:'+e(data.colors.blue)+';--navy:'+e(data.colors.navy)+';--plum:'+e(data.colors.plum)+';--coral:'+e(data.colors.coral)+';font-family:'+e(font)+'"><header class="shell nav"><div class="links">'+links+'</div><a class="brand">'+e(data.nav.brand)+'</a><div class="actions"><a>'+e(data.nav.login)+'</a><a class="sitebtn">'+e(data.nav.cta)+'</a></div></header><main><section class="hero"><div class="shell"><h1>'+title+'</h1><p class="sub">'+e(data.hero.subtitle)+'</p><form class="search" id="planSearch"><input id="planQuery" value="'+e(data.hero.search)+'" placeholder="Search data plans" aria-label="Search data plans"><button type="submit">Search</button></form></div><div class="stage"><div class="swoosh"></div><div class="photo left" style="background-image:url('+e(data.hero.leftImage)+')"></div><div class="phone"><div class="phonebar">'+e(data.hero.phoneBrand)+'</div><h2>'+e(data.hero.phoneTitle)+'</h2><div class="note"><strong>'+e(data.hero.noteTitle)+'</strong><br>'+e(data.hero.note)+'</div><div class="trip"><div class="tripimg" style="background-image:url('+e(data.hero.phoneImage)+')"></div><div class="tripcopy"><strong>'+e(data.hero.trip)+'</strong><span>'+e(data.hero.tripMeta)+'</span></div></div></div><div class="photo right" style="background-image:url('+e(data.hero.rightImage)+')"><span class="pin">'+e(data.hero.pin)+'</span></div></div></section><section class="intro"><div class="shell"><h2>'+e(data.intro.title)+'</h2><p>'+e(data.intro.body)+'</p><a class="sitebtn" href="#plans">'+e(data.intro.button)+'</a></div></section><section class="feature"><div class="shell"><div class="feature-card"><h3>'+e(data.feature.title)+'</h3><p>'+e(data.feature.body)+'</p><div class="fphone"><div class="map" style="background-image:url('+e(data.feature.mapImage)+')"></div><div class="maplabel"><strong>'+e(data.feature.labelTitle)+'</strong><br>'+e(data.feature.labelText)+'</div></div></div></div></section><section id="plans" class="plans"><div class="shell"><h2>'+e(data.plansTitle)+'</h2><div class="grid">'+plans+'</div></div></section></main><footer class="foot"><div class="shell"><span>'+e(data.footer.left)+'</span><span>'+e(data.footer.right)+'</span></div></footer></div>'}
function initSearch(){var form=document.getElementById('planSearch'),input=document.getElementById('planQuery'),cards=[].slice.call(document.querySelectorAll('.plancard'));if(!form||!input)return;function reset(){cards.forEach(function(card){card.style.display=''})}function run(){var q=input.value.trim().toLowerCase();if(!q){reset();return}cards.forEach(function(card){card.style.display=card.innerText.toLowerCase().indexOf(q)>-1?'':'none'});var plans=document.getElementById('plans');if(plans)plans.scrollIntoView({behavior:'smooth',block:'start'})}form.onsubmit=function(e){e.preventDefault();run()};input.oninput=function(){if(!input.value.trim())reset()}}
async function boot(){renderSite();initSearch();try{var r=await fetch('/api/cms',{cache:'no-store'});var j=await r.json();data=mergeDefaults(clone(defaults),j.content||{})}catch(err){data=clone(defaults)}renderSite();initSearch()}
boot();
</script>
