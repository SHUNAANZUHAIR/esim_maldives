<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AtollSIM | Maldives eSIM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@400;600;700;800;900&family=Montserrat:wght@400;600;700;800;900&family=Nunito:wght@400;600;700;800;900&family=Lora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#090921;--muted:#5f6070;--paper:#f8f7f3;--aqua:#dff7ef;--line:#e8e5df;--blue:#6574f7;--navy:#090921}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:0}a{text-decoration:none;color:inherit}button,input{font:inherit}.site{min-height:100vh;background:var(--paper)}.shell{width:min(1080px,calc(100% - 44px));margin:0 auto}.nav{height:76px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px}.links,.actions{display:flex;gap:24px;align-items:center;font-size:14px;font-weight:800}.actions{justify-content:flex-end}.brand{color:var(--blue);font-size:25px;font-weight:900}.sitebtn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 20px;border-radius:999px;background:var(--navy);color:white;font-size:13px;font-weight:900}.hero{background:linear-gradient(180deg,var(--aqua) 0 58%,var(--paper) 58% 100%);min-height:690px;padding:34px 0 0;text-align:center;overflow:hidden}.plans-strip{display:flex;justify-content:center;gap:22px;margin:112px auto 26px}.mini-plan{width:118px;height:128px;border-radius:12px;background:#fff;display:grid;align-content:center;justify-items:center;gap:22px;box-shadow:0 12px 30px rgba(9,9,33,.04)}.mini-plan strong{font-size:14px;font-weight:900}.mini-plan span{font-size:17px;font-weight:900}.hero h1{max-width:640px;margin:0 auto 14px;font-size:42px;line-height:1.04;font-weight:900;white-space:pre-line}.sub{max-width:460px;margin:0 auto 26px;color:var(--muted);font-size:13px;line-height:1.45}.search{width:min(440px,calc(100% - 28px));margin:0 auto 34px;padding:8px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;background:#fff;border-radius:999px;box-shadow:0 10px 28px rgba(7,7,36,.04)}.search input{min-width:0;border:0;outline:0;padding:0 16px;background:transparent;font-size:13px}.search button{min-height:38px;border:0;border-radius:999px;padding:0 17px;background:var(--navy);color:white;font-size:12px;font-weight:900}.phone{width:178px;height:230px;margin:0 auto;border:4px solid #050514;border-radius:28px;background:#fff;display:grid;place-items:center;font-size:9px;font-weight:900}.plans{padding:64px 0 88px}.plans h2{text-align:center;margin:0 0 24px;font-size:36px;line-height:1.08}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.plancard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;min-height:150px}.plancard small{display:block;color:var(--blue);font-weight:900;margin-bottom:12px}.plancard h3{margin:0 0 10px;font-size:23px}.plancard p{margin:0 0 18px;color:var(--muted);font-size:14px;line-height:1.45}.price{font-size:26px;font-weight:900}.price span{font-size:13px;color:var(--muted)}.foot{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:14px}.foot .shell{display:flex;justify-content:space-between}@media(max-width:760px){.shell{width:min(390px,calc(100% - 32px))}.nav{height:68px;grid-template-columns:1fr auto}.links,.actions a:first-child{display:none}.brand{font-size:16px}.sitebtn{min-height:38px;padding:0 18px}.hero{min-height:760px;padding-top:62px;background:linear-gradient(180deg,var(--aqua) 0 52%,var(--paper) 52% 100%)}.plans-strip{display:none}.hero h1{font-size:30px;max-width:260px;margin-top:54px}.sub{font-size:11px;max-width:240px}.search{width:min(320px,100%);margin-top:22px}.phone{width:138px;height:190px;margin-top:36px}.plans{padding:48px 0 70px}.plans h2{font-size:28px}.grid{grid-template-columns:1fr}.foot .shell{display:grid;gap:8px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
var defaults={colors:{paper:'#f8f7f3',blue:'#6574f7',navy:'#090921',aqua:'#dff7ef'},typography:{font:'Inter'},nav:{brand:'AtollSIM',links:'Plans, Explore, Pricing, Support',login:'Log in',cta:'Try for free'},hero:{title:'The only travel eSIM\nyou’ll need',subtitle:'Explore simple data plans, activate before you land, and keep every transfer, booking, and WhatsApp message within reach.',search:'Search plans',phoneBrand:'atoll',phoneTitle:'My eSIMs'},plansTitle:'Simple Maldives plans',plans:[{tag:'Discover',name:'Discover',description:'Easy data for maps, messages, and arrival essentials.',price:'10GB',meta:''},{tag:'Surf',name:'Surf',description:'More data for browsing, bookings, transfers, and WhatsApp.',price:'15GB',meta:''},{tag:'Dive',name:'Dive',description:'Large data for longer stays and heavier travel use.',price:'25GB',meta:''}],footer:{left:'AtollSIM',right:'Maldives travel eSIM'}};
var data=clone(defaults);function clone(o){return JSON.parse(JSON.stringify(o))}function mergeDefaults(base,saved){Object.keys(base).forEach(function(k){if(saved[k]===undefined)saved[k]=clone(base[k]);else if(base[k]&&typeof base[k]==='object'&&!Array.isArray(base[k]))mergeDefaults(base[k],saved[k])});return saved}function e(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}function fontFamily(){var f=data.typography&&data.typography.font||'Inter';var map={Inter:'Inter,system-ui,sans-serif',Poppins:'Poppins,Inter,sans-serif',Montserrat:'Montserrat,Inter,sans-serif',Nunito:'Nunito,Inter,sans-serif',Lora:'Lora,Georgia,serif',Georgia:'Georgia,serif',System:'system-ui,sans-serif'};return map[f]||map.Inter}function renderSite(){var links=(data.nav.links||'').split(',').map(function(x){return x.trim()}).filter(Boolean).map(function(x){return '<a href="#plans">'+e(x)+'</a>'}).join('');var mini=data.plans.slice(0,3).map(function(p){return '<article class="mini-plan"><strong>'+e(p.name)+'</strong><span>'+e(p.price)+'</span></article>'}).join('');var cards=data.plans.map(function(p){return '<article class="plancard"><small>'+e(p.tag)+'</small><h3>'+e(p.name)+'</h3><p>'+e(p.description)+'</p><div class="price">'+e(p.price)+' <span>'+e(p.meta)+'</span></div></article>'}).join('');document.getElementById('app').innerHTML='<div class="site" style="--paper:'+e(data.colors.paper)+';--aqua:'+e(data.colors.aqua||'#dff7ef')+';--blue:'+e(data.colors.blue)+';--navy:'+e(data.colors.navy)+';font-family:'+e(fontFamily())+'"><header class="shell nav"><div class="links">'+links+'</div><a class="brand">'+e(data.nav.brand)+'</a><div class="actions"><a>'+e(data.nav.login)+'</a><a class="sitebtn">'+e(data.nav.cta)+'</a></div></header><main><section class="hero"><div class="shell"><div class="plans-strip">'+mini+'</div><h1>'+e(data.hero.title)+'</h1><p class="sub">'+e(data.hero.subtitle)+'</p><form class="search" id="planSearch"><input id="planQuery" value="'+e(data.hero.search)+'" aria-label="Search plans"><button type="submit">Search</button></form><div class="phone"><span>'+e(data.hero.phoneTitle)+'</span></div></div></section><section id="plans" class="plans"><div class="shell"><h2>'+e(data.plansTitle)+'</h2><div class="grid">'+cards+'</div></div></section></main><footer class="foot"><div class="shell"><span>'+e(data.footer.left)+'</span><span>'+e(data.footer.right)+'</span></div></footer></div>';initSearch()}function initSearch(){var form=document.getElementById('planSearch'),input=document.getElementById('planQuery'),cards=[].slice.call(document.querySelectorAll('.plancard'));if(!form||!input)return;function reset(){cards.forEach(function(card){card.style.display=''})}function run(){var q=input.value.trim().toLowerCase();if(!q){reset();return}cards.forEach(function(card){card.style.display=card.innerText.toLowerCase().indexOf(q)>-1?'':'none'});var plans=document.getElementById('plans');if(plans)plans.scrollIntoView({behavior:'smooth',block:'start'})}form.onsubmit=function(ev){ev.preventDefault();run()};input.oninput=function(){if(!input.value.trim())reset()}}async function boot(){renderSite();try{var r=await fetch('/api/cms',{cache:'no-store'});var j=await r.json();data=mergeDefaults(clone(defaults),j.content||{})}catch(err){data=clone(defaults)}renderSite()}boot();
</script>
</body>
</html>
