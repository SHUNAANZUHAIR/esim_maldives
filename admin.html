<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AtollSIM Admin CMS</title>
<style>
:root{--ink:#080820;--muted:#74727f;--line:#e8e5df;--paper:#fbfaf7;--blue:#6574f7;--navy:#090921;--plum:#650735;--coral:#ff755f;--danger:#bd2d2d}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#f4f2ee;letter-spacing:0}button,input,textarea{font:inherit}.hide{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(420px,100%);padding:28px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 20px 70px rgba(8,8,32,.08)}.login-card h1{margin:0 0 8px;font-size:32px}.login-card p{margin:0 0 22px;color:var(--muted);line-height:1.5}.field{display:grid;gap:7px;margin-bottom:13px}.field label{font-size:12px;font-weight:850;color:var(--muted);text-transform:uppercase}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;padding:11px 12px;outline:none}.field textarea{min-height:74px;resize:vertical}.btn{min-height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);padding:0 12px;font-weight:850;font-size:13px;cursor:pointer}.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}.btn.danger{color:var(--danger)}.error{margin-top:12px;color:var(--danger);font-size:13px;font-weight:800}.app{min-height:100vh;display:grid;grid-template-columns:390px 1fr}.side{height:100vh;overflow:auto;background:#fff;border-right:1px solid var(--line)}.head{position:sticky;top:0;z-index:2;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:18px}.head h1{margin:0;font-size:22px}.head p{margin:5px 0 14px;color:var(--muted);font-size:13px}.tools{display:flex;gap:8px;flex-wrap:wrap}.editor{padding:14px 18px 28px}.group{border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}.group summary{padding:14px 15px;font-weight:900;background:#fbfaf7;cursor:pointer}.group summary::-webkit-details-marker{display:none}.body{padding:14px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.planbox{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}.planbox h4{margin:0 0 12px}.preview-wrap{height:100vh;overflow:auto;padding:22px}.preview-top{display:flex;justify-content:space-between;margin-bottom:14px}.hint{color:var(--muted);font-size:13px}.frame{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden;box-shadow:0 18px 60px rgba(8,8,32,.08)}
.site{background:var(--paper);color:#070724}.shell{width:min(960px,calc(100% - 36px));margin:0 auto}.nav{height:76px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;font-size:12px;font-weight:750}.links,.actions{display:flex;gap:28px;align-items:center}.actions{justify-content:flex-end;gap:16px}.brand{color:var(--blue);font-size:25px;font-weight:860}.sitebtn{min-height:38px;border:0;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;padding:0 20px;color:#fff;background:var(--navy);font-size:12px;font-weight:800}.hero{position:relative;min-height:760px;padding:58px 0 0;text-align:center}.hero h1{max-width:710px;margin:0 auto 16px;font-size:clamp(48px,7vw,76px);line-height:.94;font-weight:860;white-space:pre-line}.plane{display:inline-grid;place-items:center;width:.92em;height:.92em;margin:0 .06em;color:var(--blue);border:4px solid currentColor;border-radius:18px 18px 18px 4px;transform:rotate(-28deg) translateY(.08em);font-size:.48em;vertical-align:.2em}.plane:before{content:"✦";transform:rotate(28deg)}.sub{margin:0 auto 24px;max-width:520px;color:#6f6d7a;font-size:16px;line-height:1.6}.search{width:min(470px,100%);margin:0 auto;padding:8px;display:grid;grid-template-columns:1fr auto;gap:8px;background:#fff;border-radius:999px;box-shadow:0 10px 28px rgba(7,7,36,.04)}.search input{min-width:0;border:0;outline:0;padding:0 18px;background:transparent;font-size:13px}.search button{min-height:40px;border:0;border-radius:999px;padding:0 18px;color:#fff;background:var(--navy);font-size:12px;font-weight:800}.stage{position:absolute;left:0;right:0;bottom:0;height:420px;pointer-events:none}.swoosh{position:absolute;left:72px;right:72px;bottom:0;height:260px;border:74px solid var(--blue);border-top:0;border-radius:0 0 220px 220px;transform:skewX(-12deg)}.phone{position:absolute;left:50%;bottom:-12px;width:310px;height:430px;transform:translateX(-50%);border:6px solid #050514;border-bottom:0;border-radius:42px 42px 0 0;background:#fff;box-shadow:0 -10px 0 #050514 inset;padding:22px;text-align:left;overflow:hidden}.phone:before{content:"";position:absolute;top:10px;left:50%;width:112px;height:24px;transform:translateX(-50%);border-radius:999px;background:#050514}.phonebar{margin-top:34px;color:var(--blue);font-weight:900}.phone h2{margin:28px 0 14px;font-size:22px}.note{padding:16px;border:1px dashed #ddd8d0;border-radius:10px;color:#6f6d7a;background:#fffdf9;font-size:12px;line-height:1.4}.trip{margin-top:16px;border-radius:12px;overflow:hidden;background:#fff;border:1px solid #ece9e3}.tripimg{height:118px;background-position:center;background-size:cover}.tripcopy{padding:12px}.tripcopy strong{display:block;font-size:13px}.tripcopy span{color:#6f6d7a;font-size:11px}.photo{position:absolute;width:235px;height:230px;border-radius:18px;background-size:cover;background-position:center;box-shadow:0 18px 44px rgba(7,7,36,.1)}.left{left:84px;bottom:96px;transform:rotate(-3deg)}.right{right:92px;bottom:96px;transform:rotate(3deg)}.pin{position:absolute;right:72px;top:-10px;padding:8px 12px;border-radius:999px;background:#fff;box-shadow:0 8px 24px rgba(7,7,36,.08);font-size:12px;font-weight:800}.intro{padding:70px 0 54px;text-align:center;background:#fff}.intro h2{max-width:650px;margin:0 auto 12px;font-size:clamp(36px,5vw,54px);line-height:1.02;white-space:pre-line}.intro p{max-width:560px;margin:0 auto 24px;color:#6f6d7a;line-height:1.65}.feature{padding:66px 0 86px;background:#fff}.feature-card{position:relative;min-height:410px;overflow:hidden;border-radius:18px;background:var(--plum);color:#fff;padding:58px 52px}.feature-card:after{content:"";position:absolute;right:-58px;top:-26px;width:430px;height:430px;border:70px solid var(--coral);border-radius:50%}.feature-card h3{position:relative;z-index:1;max-width:390px;margin:68px 0 16px;font-size:38px;line-height:1.08;white-space:pre-line}.feature-card p{position:relative;z-index:1;max-width:420px;margin:0;color:rgba(255,255,255,.74);line-height:1.65}.fphone{position:absolute;z-index:1;right:68px;bottom:-34px;width:280px;height:340px;border:6px solid #070714;border-bottom:0;border-radius:38px 38px 0 0;background:#fff;padding:22px;color:#070724}.fphone:before{content:"";position:absolute;top:10px;left:50%;width:100px;height:22px;transform:translateX(-50%);border-radius:999px;background:#070714}.map{margin-top:42px;height:160px;border-radius:14px;background-position:center;background-size:cover}.maplabel{margin-top:-34px;margin-left:-24px;width:190px;border-radius:10px;padding:12px;background:#fff;box-shadow:0 10px 24px rgba(0,0,0,.12);font-size:12px}.plans{padding:76px 0 90px;background:var(--paper)}.plans h2{margin:0 0 26px;text-align:center;font-size:44px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.plancard{padding:24px;border-radius:16px;background:#fff;border:1px solid #ece9e3}.plancard small{color:var(--blue);font-weight:900}.plancard h3{margin:18px 0 8px;font-size:24px}.plancard p{color:#6f6d7a;line-height:1.55;margin:0 0 20px}.price{font-size:34px;font-weight:900}.price span{color:#6f6d7a;font-size:13px;font-weight:700}.foot{padding:30px 0;background:var(--paper);color:#6f6d7a;font-size:13px}.foot .shell{display:flex;justify-content:space-between;gap:16px}@media(max-width:900px){.app{grid-template-columns:1fr}.side,.preview-wrap{height:auto}.links{display:none}.nav{display:block;height:auto;padding:18px 0;text-align:center}.brand{display:block;margin-bottom:16px}.actions{justify-content:center}.photo{display:none}.phone{width:250px;height:360px}.hero{min-height:680px}.grid{grid-template-columns:1fr}.feature-card{min-height:620px}.fphone{left:50%;right:auto;transform:translateX(-50%)}}
</style>
</head>
<body>
<section id="login" class="login"><form id="loginForm" class="login-card"><h1>AtollSIM CMS</h1><p>Sign in to edit the website visually. Preview login: <b>admin</b> / <b>admin123#</b>.</p><div class="field"><label>Login name</label><input id="user" required></div><div class="field"><label>Password</label><input id="pass" type="password" required></div><button class="btn primary">Log in</button><div id="err" class="error hide">Invalid login name or password.</div></form></section>
<section id="app" class="app hide"><aside class="side"><div class="head"><h1>AtollSIM CMS</h1><p>No-code controls for the whole landing page.</p><div class="tools"><button id="save" class="btn primary">Save</button><button id="addPlan" class="btn">Add plan</button><button id="export" class="btn">Export</button><button id="reset" class="btn danger">Reset</button><button id="logout" class="btn">Log out</button></div></div><div id="editor" class="editor"></div></aside><main class="preview-wrap"><div class="preview-top"><strong>Website screen</strong><span class="hint">Live preview</span></div><div class="frame"><div id="preview"></div></div></main></section>
<script>
var KEY='atollsim_cms_v2';
var defaults={colors:{paper:'#fbfaf7',blue:'#6574f7',navy:'#090921',plum:'#650735',coral:'#ff755f'},nav:{brand:'AtollSIM',links:'Plans, Explore, Pricing, Support',login:'Log in',cta:'Try for free'},hero:{title:'Rediscover the joy\nof the journey',subtitle:'One Maldives eSIM to plan your next island adventure.',search:'Find tourist data plans in Maldives',pin:'Maldives',phoneBrand:'atoll',phoneTitle:'My eSIMs',noteTitle:'Create New Trip',note:'Unlock and activate your next adventure.',trip:'Maldives Resort Trip',tripMeta:'10 GB · 15 days',leftImage:'https://images.unsplash.com/photo-1540202404-a2f29016b523?auto=format&fit=crop&w=700&q=80',rightImage:'https://images.unsplash.com/photo-1514282401047-d79a71a590e8?auto=format&fit=crop&w=700&q=80',phoneImage:'https://images.unsplash.com/photo-1578922746465-3a80a228f223?auto=format&fit=crop&w=700&q=80'},intro:{title:'The only travel eSIM you’ll need',body:'Explore simple data plans, activate before you land, and keep every transfer, booking, and WhatsApp message within reach.',button:'Start planning now →'},feature:{title:'Travel-friendly recommendations',body:'Skip airport SIM queues. Choose a plan that fits your stay and get simple setup support for your Maldives trip.',labelTitle:'Resort Ready',labelText:'10 GB for 15 days · popular',mapImage:'https://images.unsplash.com/photo-1569336415962-a4bd9f69c07b?auto=format&fit=crop&w=600&q=80'},plansTitle:'Simple Maldives plans',plans:[{tag:'Arrival',name:'Starter',description:'Maps, pickup messages, and hotel check-in.',price:'$9',meta:'/ 3 GB'},{tag:'Popular',name:'Resort Ready',description:'Daily browsing, WhatsApp, bookings, and transfers.',price:'$19',meta:'/ 10 GB'},{tag:'Extended',name:'Island Hopper',description:'Longer stays and heavier travel data use.',price:'$32',meta:'/ 25 GB'}],footer:{left:'AtollSIM',right:'Maldives travel eSIM'}};
var data=load();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||clone(defaults)}catch(e){return clone(defaults)}}function clone(o){return JSON.parse(JSON.stringify(o))}function saveData(){localStorage.setItem(KEY,JSON.stringify(data));render()}function e(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}function get(path){var o=data;path.split('.').forEach(function(p){o=o[p]});return o}function set(path,val){var parts=path.split('.');var o=data;for(var i=0;i<parts.length-1;i++)o=o[parts[i]];o[parts[parts.length-1]]=val;saveData()}function field(label,path,type){var v=get(path);return '<div class="field"><label>'+label+'</label><input type="'+(type||'text')+'" value="'+e(v)+'" data-path="'+path+'"></div>'}function area(label,path){return '<div class="field"><label>'+label+'</label><textarea data-path="'+path+'">'+e(get(path))+'</textarea></div>'}
function renderEditor(){var h='';h+='<details class="group" open><summary>Navigation</summary><div class="body">'+field('Brand','nav.brand')+field('Links, comma separated','nav.links')+field('Login text','nav.login')+field('Button text','nav.cta')+'</div></details>';h+='<details class="group" open><summary>Hero</summary><div class="body">'+area('Headline','hero.title')+area('Subtitle','hero.subtitle')+field('Search text','hero.search')+field('Location pin','hero.pin')+field('Phone brand','hero.phoneBrand')+field('Phone title','hero.phoneTitle')+field('Phone note title','hero.noteTitle')+area('Phone note','hero.note')+field('Trip title','hero.trip')+field('Trip meta','hero.tripMeta')+field('Left image URL','hero.leftImage')+field('Right image URL','hero.rightImage')+field('Phone image URL','hero.phoneImage')+'</div></details>';h+='<details class="group"><summary>Intro</summary><div class="body">'+area('Title','intro.title')+area('Body','intro.body')+field('Button','intro.button')+'</div></details>';h+='<details class="group"><summary>Feature</summary><div class="body">'+area('Title','feature.title')+area('Body','feature.body')+field('Label title','feature.labelTitle')+field('Label text','feature.labelText')+field('Map image URL','feature.mapImage')+'</div></details>';h+='<details class="group" open><summary>Plans</summary><div class="body">'+field('Section title','plansTitle');data.plans.forEach(function(p,i){h+='<div class="planbox"><h4>Plan '+(i+1)+'</h4>'+field('Tag','plans.'+i+'.tag')+field('Name','plans.'+i+'.name')+area('Description','plans.'+i+'.description')+'<div class="two">'+field('Price','plans.'+i+'.price')+field('Meta','plans.'+i+'.meta')+'</div><button class="btn danger" data-remove="'+i+'">Remove</button></div>'});h+='</div></details>';h+='<details class="group"><summary>Colors</summary><div class="body"><div class="two">'+field('Page','colors.paper','color')+field('Accent','colors.blue','color')+field('Button','colors.navy','color')+field('Feature','colors.plum','color')+field('Shape','colors.coral','color')+'</div></div></details>';h+='<details class="group"><summary>Footer</summary><div class="body">'+field('Left','footer.left')+field('Right','footer.right')+'</div></details>';editor.innerHTML=h;editor.querySelectorAll('[data-path]').forEach(function(x){x.addEventListener('input',function(){set(this.dataset.path,this.value)})});editor.querySelectorAll('[data-remove]').forEach(function(x){x.addEventListener('click',function(){data.plans.splice(Number(this.dataset.remove),1);saveData()})})}
function renderPreview(){var links=data.nav.links.split(',').map(function(x){return x.trim()}).filter(Boolean).map(function(x){return '<a>'+e(x)+'</a>'}).join('');var title=e(data.hero.title).replace('journey','<span class="plane"></span> journey');var plans=data.plans.map(function(p){return '<article class="plancard"><small>'+e(p.tag)+'</small><h3>'+e(p.name)+'</h3><p>'+e(p.description)+'</p><div class="price">'+e(p.price)+' <span>'+e(p.meta)+'</span></div></article>'}).join('');preview.innerHTML='<div class="site" style="--paper:'+e(data.colors.paper)+';--blue:'+e(data.colors.blue)+';--navy:'+e(data.colors.navy)+';--plum:'+e(data.colors.plum)+';--coral:'+e(data.colors.coral)+'"><header class="shell nav"><div class="links">'+links+'</div><a class="brand">'+e(data.nav.brand)+'</a><div class="actions"><a>'+e(data.nav.login)+'</a><a class="sitebtn">'+e(data.nav.cta)+'</a></div></header><main><section class="hero"><div class="shell"><h1>'+title+'</h1><p class="sub">'+e(data.hero.subtitle)+'</p><form class="search"><input value="'+e(data.hero.search)+'"><button>Search</button></form></div><div class="stage"><div class="swoosh"></div><div class="photo left" style="background-image:url('+e(data.hero.leftImage)+')"></div><div class="phone"><div class="phonebar">'+e(data.hero.phoneBrand)+'</div><h2>'+e(data.hero.phoneTitle)+'</h2><div class="note"><strong>'+e(data.hero.noteTitle)+'</strong><br>'+e(data.hero.note)+'</div><div class="trip"><div class="tripimg" style="background-image:url('+e(data.hero.phoneImage)+')"></div><div class="tripcopy"><strong>'+e(data.hero.trip)+'</strong><span>'+e(data.hero.tripMeta)+'</span></div></div></div><div class="photo right" style="background-image:url('+e(data.hero.rightImage)+')"><span class="pin">'+e(data.hero.pin)+'</span></div></div></section><section class="intro"><div class="shell"><h2>'+e(data.intro.title)+'</h2><p>'+e(data.intro.body)+'</p><a class="sitebtn">'+e(data.intro.button)+'</a></div></section><section class="feature"><div class="shell"><div class="feature-card"><h3>'+e(data.feature.title)+'</h3><p>'+e(data.feature.body)+'</p><div class="fphone"><div class="map" style="background-image:url('+e(data.feature.mapImage)+')"></div><div class="maplabel"><strong>'+e(data.feature.labelTitle)+'</strong><br>'+e(data.feature.labelText)+'</div></div></div></div></section><section class="plans"><div class="shell"><h2>'+e(data.plansTitle)+'</h2><div class="grid">'+plans+'</div></div></section></main><footer class="foot"><div class="shell"><span>'+e(data.footer.left)+'</span><span>'+e(data.footer.right)+'</span></div></footer></div>'}
function render(){renderEditor();renderPreview()}loginForm.addEventListener('submit',function(ev){ev.preventDefault();if(user.value==='admin'&&pass.value==='admin123#'){login.classList.add('hide');app.classList.remove('hide');render()}else err.classList.remove('hide')});save.addEventListener('click',saveData);addPlan.addEventListener('click',function(){data.plans.push({tag:'New',name:'New plan',description:'Describe this plan.',price:'$0',meta:'/ data'});saveData()});reset.addEventListener('click',function(){if(confirm('Reset CMS content?')){data=clone(defaults);saveData()}});logout.addEventListener('click',function(){app.classList.add('hide');login.classList.remove('hide');pass.value=''});export.addEventListener('click',function(){var text=JSON.stringify(data,null,2);navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(text).then(function(){alert('Content JSON copied.')},function(){prompt('Copy JSON:',text)}):prompt('Copy JSON:',text)});
</script>
</body>
</html>
