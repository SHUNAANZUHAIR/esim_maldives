<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AtollSIM CMS</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f6f4ef;color:#080820}button,input,textarea,select{font:inherit}.hide{display:none!important}.login{min-height:100vh;display:grid;place-items:center}.card{background:white;border:1px solid #e8e5df;border-radius:12px;padding:26px;width:min(420px,calc(100% - 32px))}.app{display:grid;grid-template-columns:390px 1fr;min-height:100vh}.side{height:100vh;overflow:auto;background:#fff;border-right:1px solid #e8e5df}.head{position:sticky;top:0;background:#fffffff5;border-bottom:1px solid #e8e5df;padding:16px;z-index:2}.tools{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #e8e5df;border-radius:8px;background:#fff;min-height:38px;padding:0 12px;font-weight:850;cursor:pointer}.primary{background:#090921;color:white;border-color:#090921}.danger{color:#b42318}.edit{padding:14px}.group{border:1px solid #e8e5df;border-radius:10px;margin-bottom:12px;overflow:hidden}.group summary{padding:13px;background:#fbfaf7;font-weight:900}.body{padding:13px}.field{display:grid;gap:6px;margin-bottom:11px}.field label{font-size:12px;color:#74727f;font-weight:850;text-transform:uppercase}.field input,.field textarea,.field select{width:100%;border:1px solid #e8e5df;border-radius:8px;padding:10px;background:#fff}.field textarea{min-height:72px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.plan{border:1px solid #e8e5df;border-radius:8px;padding:10px;margin-bottom:10px}.preview{height:100vh}.preview iframe{width:100%;height:100%;border:0}.hint{color:#74727f;font-size:13px}@media(max-width:850px){.app{grid-template-columns:1fr}.side,.preview{height:auto}.preview iframe{height:780px}}</style></head><body><section id="login" class="login"><form id="loginForm" class="card"><h1>AtollSIM CMS</h1><p class="hint">Cloud CMS for the Vercel website.</p><div class="field"><label>Login name</label><input id="user" required></div><div class="field"><label>Password</label><input id="pass" type="password" required></div><button class="btn primary">Log in</button><p id="err" class="danger hide">Invalid login.</p></form></section><section id="app" class="app hide"><aside class="side"><div class="head"><h1>AtollSIM CMS</h1><div class="tools"><button id="save" class="btn primary">Save</button><button id="add" class="btn">Add plan</button><button id="publish" class="btn primary">Publish changes</button><button id="reset" class="btn danger">Reset</button><button id="logout" class="btn">Log out</button></div><p id="status" class="hint"></p></div><div id="editor" class="edit"></div></aside><main class="preview"><iframe id="screen" src="/"></iframe></main></section><script>var defaults={colors:{paper:'#fbfaf7',blue:'#6574f7',navy:'#090921',plum:'#650735',coral:'#ff755f'},typography:{font:'Inter'},nav:{brand:'AtollSIM',links:'Plans, Explore, Pricing, Support',login:'Log in',cta:'Try for free'},hero:{title:'Rediscover the joy\nof the journey',subtitle:'One Maldives eSIM to plan your next island adventure.',search:'Find tourist data plans in Maldives',pin:'Maldives',phoneBrand:'atoll',phoneTitle:'My eSIMs',noteTitle:'Create New Trip',note:'Unlock and activate your next adventure.',trip:'Maldives Resort Trip',tripMeta:'10 GB · 15 days',leftImage:'https://images.unsplash.com/photo-1540202404-a2f29016b523?auto=format&fit=crop&w=700&q=80',rightImage:'https://images.unsplash.com/photo-1514282401047-d79a71a590e8?auto=format&fit=crop&w=700&q=80',phoneImage:'https://images.unsplash.com/photo-1578922746465-3a80a228f223?auto=format&fit=crop&w=700&q=80',bgDesktop:'https://images.unsplash.com/photo-1514282401047-d79a71a590e8?auto=format&fit=crop&w=1800&q=80',bgMobile:'https://images.unsplash.com/photo-1578922746465-3a80a228f223?auto=format&fit=crop&w=900&q=80'},intro:{title:'The only travel eSIM you’ll need',body:'Explore simple data plans, activate before you land, and keep every transfer, booking, and WhatsApp message within reach.',button:'Start planning now →'},feature:{title:'Travel-friendly recommendations',body:'Skip airport SIM queues. Choose a plan that fits your stay and get simple setup support for your Maldives trip.',labelTitle:'Resort Ready',labelText:'10 GB for 15 days · popular',mapImage:'https://images.unsplash.com/photo-1569336415962-a4bd9f69c07b?auto=format&fit=crop&w=600&q=80'},plansTitle:'Simple Maldives plans',plans:[{tag:'Arrival',name:'Starter',description:'Maps, pickup messages, and hotel check-in.',price:'$9',meta:'/ 3 GB'},{tag:'Popular',name:'Resort Ready',description:'Daily browsing, WhatsApp, bookings, and transfers.',price:'$19',meta:'/ 10 GB'},{tag:'Extended',name:'Island Hopper',description:'Longer stays and heavier travel data use.',price:'$32',meta:'/ 25 GB'}],footer:{left:'AtollSIM',right:'Maldives travel eSIM'}},data=clone(defaults),timer=null;function $(id){return document.getElementById(id)}function clone(o){return JSON.parse(JSON.stringify(o))}function merge(a,b){Object.keys(a).forEach(function(k){if(b[k]===undefined)b[k]=clone(a[k]);else if(a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))merge(a[k],b[k])});return b}function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}function get(p){var o=data;p.split('.').forEach(function(k){o=o[k]});return o}function set(p,v){var a=p.split('.'),o=data;for(var i=0;i<a.length-1;i++)o=o[a[i]];o[a[a.length-1]]=v;clearTimeout(timer);timer=setTimeout(saveCloud,700)}async function loadCloud(){try{var r=await fetch('/api/cms',{cache:'no-store'}),j=await r.json();data=merge(clone(defaults),j.content||{})}catch(e){data=clone(defaults)}}async function saveCloud(){await fetch('/api/cms',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:data})});$('status').textContent='Saved to Vercel cloud'}function field(l,p,t){return '<div class="field"><label>'+l+'</label><input type="'+(t||'text')+'" value="'+esc(get(p))+'" data-path="'+p+'"></div>'}function area(l,p){return '<div class="field"><label>'+l+'</label><textarea data-path="'+p+'">'+esc(get(p))+'</textarea></div>'}function upload(l,p){return '<div class="field"><label>'+l+'</label><input type="file" accept="image/*" data-upload="'+p+'"><input type="text" value="'+esc(get(p))+'" data-path="'+p+'" placeholder="Image URL or uploaded image"></div>'}function select(l,p){var a=['Inter','Poppins','Montserrat','Nunito','Lora','Georgia','System'];return '<div class="field"><label>'+l+'</label><select data-path="'+p+'">'+a.map(function(x){return '<option'+(get(p)===x?' selected':'')+'>'+x+'</option>'}).join('')+'</select></div>'}function render(){var h='';h+='<details class="group" open><summary>Navigation</summary><div class="body">'+field('Brand','nav.brand')+field('Links','nav.links')+field('Login text','nav.login')+field('Button','nav.cta')+'</div></details>';h+='<details class="group" open><summary>Hero</summary><div class="body">'+area('Headline','hero.title')+area('Subtitle','hero.subtitle')+field('Search','hero.search')+field('Location','hero.pin')+field('Phone brand','hero.phoneBrand')+field('Phone title','hero.phoneTitle')+field('Note title','hero.noteTitle')+area('Note','hero.note')+field('Trip','hero.trip')+field('Trip meta','hero.tripMeta')+upload('Hero image - large screen','hero.bgDesktop')+upload('Hero image - small screen','hero.bgMobile')+field('Left image','hero.leftImage')+field('Right image','hero.rightImage')+field('Phone image','hero.phoneImage')+'</div></details>';h+='<details class="group"><summary>Intro</summary><div class="body">'+area('Title','intro.title')+area('Body','intro.body')+field('Button','intro.button')+'</div></details>';h+='<details class="group"><summary>Feature</summary><div class="body">'+area('Title','feature.title')+area('Body','feature.body')+field('Label title','feature.labelTitle')+field('Label text','feature.labelText')+field('Map image','feature.mapImage')+'</div></details>';h+='<details class="group" open><summary>Plans</summary><div class="body">'+field('Section title','plansTitle');data.plans.forEach(function(p,i){h+='<div class="plan"><b>Plan '+(i+1)+'</b>'+field('Tag','plans.'+i+'.tag')+field('Name','plans.'+i+'.name')+upload('Card image','plans.'+i+'.image')+area('Description','plans.'+i+'.description')+'<div class="two">'+field('Price','plans.'+i+'.price')+field('Meta','plans.'+i+'.meta')+'</div><button class="btn danger" data-remove="'+i+'">Remove</button></div>'});h+='</div></details><details class="group"><summary>Typography</summary><div class="body">'+select('Website font','typography.font')+'</div></details><details class="group"><summary>Colors</summary><div class="body"><div class="two">'+field('Page','colors.paper','color')+field('Accent','colors.blue','color')+field('Button','colors.navy','color')+field('Feature','colors.plum','color')+field('Shape','colors.coral','color')+'</div></div></details><details class="group"><summary>Footer</summary><div class="body">'+field('Left','footer.left')+field('Right','footer.right')+'</div></details>';$('editor').innerHTML=h;document.querySelectorAll('[data-path]').forEach(function(x){x.oninput=x.onchange=function(){set(this.dataset.path,this.value)}});document.querySelectorAll('[data-upload]').forEach(function(x){x.onchange=function(){var path=this.dataset.upload,file=this.files&&this.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(){set(path,reader.result);render();saveCloud()};reader.readAsDataURL(file)}});document.querySelectorAll('[data-remove]').forEach(function(x){x.onclick=function(){data.plans.splice(+this.dataset.remove,1);render();saveCloud()}})}$('loginForm').onsubmit=async function(e){e.preventDefault();$('err').classList.add('hide');var ok=$('user').value.trim().toLowerCase()==='admin'&&$('pass').value.trim()==='admin123#';if(ok){$('login').classList.add('hide');$('app').classList.remove('hide');$('editor').innerHTML='<p class="hint">Loading from Vercel cloud...</p>';$('status').textContent='Opening CMS...';render();await loadCloud();render();$('status').textContent='Ready. Changes save to Vercel cloud.'}else $('err').classList.remove('hide')};$('save').onclick=function(){saveCloud()};$('publish').onclick=async function(){$('status').textContent='Publishing...';await saveCloud();$('screen').src='/?t='+Date.now();$('status').textContent='Published. Live site reads Vercel cloud content.'};$('add').onclick=function(){data.plans.push({tag:'New',name:'New plan',description:'Describe this plan.',price:'$0',meta:'/ data'});render();saveCloud()};$('reset').onclick=function(){if(confirm('Reset CMS content?')){data=clone(defaults);render();saveCloud()}};$('logout').onclick=function(){$('app').classList.add('hide');$('login').classList.remove('hide');$('pass').value=''};$('user').focus()</script></body></html>
